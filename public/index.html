<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NutriDelivery - Iniciar Sesión</title>
    <style>
        /* CSS: Esto le da el diseño y colores a tu página */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Ingreso NutriDelivery</h2>
    <!-- El formulario donde el usuario ingresa sus datos -->
    <form id="loginForm">
        <input type="email" id="correo" placeholder="Tu Correo Electrónico" required>
        <input type="password" id="password" placeholder="Tu Contraseña" required>
        <button type="submit">Iniciar Sesión</button>
    </form>
    <p id="mensaje"></p>
</div>

<script>
    // JavaScript: Hace la validación básica y envía los datos al Backend[cite: 3]
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Evita que la página se recargue

        const correo = document.getElementById('correo').value;
        const password = document.getElementById('password').value;

        // Aquí el Frontend envía una petición HTTP (POST) a la API del Backend
        try {
            const respuesta = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ correo: correo, password: password })
            });

            const datos = await respuesta.json();
            document.getElementById('mensaje').innerText = datos.mensaje;
            
        } catch (error) {
            document.getElementById('mensaje').innerText = "Error al conectar con el servidor.";
        }
    });
</script>
</body>
</html>
